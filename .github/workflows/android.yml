# Construit l'application Android (APK) d'ABIQ à partir du site en ligne (Trusted Web Activity).
# L'APK est publié dans les « Releases » du dépôt : https://github.com/Gabish1001/Abiq/releases/latest
# Secret nécessaire : ANDROID_KEYSTORE_PASSWORD (mot de passe de android/abiq.keystore).
name: Application Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configurer Bubblewrap (JDK et SDK Android du serveur)
        run: |
          # Bubblewrap attend un dossier « tools » dans le SDK : on le crée à partir des outils en ligne de commande
          [ -e "$ANDROID_HOME/tools" ] || sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          ls "$ANDROID_HOME" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          [ -d "$ANDROID_HOME/build-tools/34.0.0" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null || true
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Numéro de version
        working-directory: android
        run: |
          jq --argjson code "${{ github.run_number }}" --arg name "1.0.${{ github.run_number }}" \
            '.appVersionCode = $code | .appVersionName = $name | .appVersion = $name' twa-manifest.json > t.json
          mv t.json twa-manifest.json

      - name: Générer le projet Android
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null

      - name: Construire et signer l'APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD manquant"; exit 1; }
          set -o pipefail
          if ! bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json < /dev/null 2>&1 | tee build.log; then
            # Résumé lisible de l'erreur dans les annotations du run
            grep -A12 "What went wrong" build.log | head -30 | sed 's/^/::error::/' || true
            grep -E "ERROR|Exception:|error:" build.log | grep -v "^\s*at " | head -15 | sed 's/^/::error::/' || true
            exit 1
          fi
          ls -la
          cp app-release-signed.apk ../abiq.apk
          cp app-release-bundle.aab ../abiq.aab || true

      - uses: actions/upload-artifact@v4
        with:
          name: abiq-android
          path: |
            abiq.apk
            abiq.aab

      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-1.0.${{ github.run_number }}"
          gh release create "$TAG" abiq.apk \
            --title "ABIQ Android 1.0.${{ github.run_number }}" \
            --notes "Application Android d'ABIQ. Télécharger abiq.apk sur le téléphone, puis autoriser l'installation depuis cette source." \
            --latest
